name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install python deps
        run: pip install -r requirements.txt
      - name: Install node deps
        run: npm ci
      - name: Run selfcheck (registry + principle checks + full tests + coverage)
        run: |
          set +e
          python3 scripts/run_selfcheck.py | tee /tmp/selfcheck.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            report=$(grep -o '报告 → .*' /tmp/selfcheck.log | tail -1 | sed 's/^报告 → //')
            python3 scripts/checks/emit_selfcheck_failure_annotations.py "$report" || true
            exit "$code"
          fi
