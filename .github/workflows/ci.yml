name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install python deps
        run: pip install -r requirements.txt
      - name: Install node deps
        run: npm ci
      - name: Run selfcheck (registry + principle checks + full tests + coverage)
        run: python3 scripts/run_selfcheck.py
