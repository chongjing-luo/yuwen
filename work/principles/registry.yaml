  - id: P-29
    title: 候选方案必须经过证伪
    statement: "设计者必须主动寻找至少一个泄答、旁观、孤立、遮蔽、可合并、失真或抢焦点问题；一轮检查没有发现任何问题应先怀疑检查力度；修改必须回到可观察变化重新举证。"
    domain: 通用
    stages: [S5]
    nodes: [J7]
