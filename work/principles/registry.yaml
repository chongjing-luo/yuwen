  - id: P-45
    title: 每一份产物都要尽善尽美
    statement: "备课与上课的品质是常态要求而非某节课的教学目标：每一份教案、每一个课件、每一页学生可见材料都尽善尽美——语言有语文之美，版式视觉有设计之美，过程有体验之美；美是完成度的一部分，由审查把关，不进入目标栏或数据字段。"
    domain: 通用
    stages: [S3, S4, S5]
    nodes: [J4]
    anchor: {doc: work/备课基本原则.md, heading: "### 45. 每一份产物都要尽善尽美"}
    enforcement:
      - {type: review_gate, gate: 美与质地审查（教案/课件/学生材料不合格即退回）}

  - id: P-46
    title: 每篇课文必备文化知识
    statement: "每篇课文都要介绍相应文化知识——作者、出处书籍、体裁、写作背景、时代背景等，作为知识清单必设类目逐条列入；不占教学目标席位，按本课文所需具体化，在需要处进入并过合书检索；时代背景解释须按解释分层标注。"
    domain: 通用
    stages: [S2, S3]
    nodes: [K1]
    anchor: {doc: work/备课基本原则.md, heading: "### 46. 每篇课文必备文化知识"}
