# ============================================================
# 原则注册库 (Principle Registry)
# 理念的唯一机器源：人读权威文本见各 source_anchor；
# 本库把每条理念绑定为「机制节点 + 强制方式」，供校验器、
# 构建器与阶段 skill 在流程时刻调用。
# 校验：python3 scripts/checks/validate_principle_registry.py
# ============================================================
meta:
  registry_version: "1.0"
  standard_version: "STANDARD-1.0"
  date: "2026-08-14"
  north_star_doc: work/evaluation/三目标实现机制.md
  coverage_rule: "每条原则必须映射至少一个机制节点，或声明 role=meta 并给出理由；每个节点必须被至少一条原则覆盖"

# 机制节点（镜像自 work/evaluation/三目标实现机制.md，二者由校验器核对标题锚点）
nodes:
  K1: {name: 教什么先于怎么教, goal: 知识学习}
  K2: {name: 知识在文本位置生长, goal: 知识学习}
  K3: {name: 检索与间隔, goal: 知识学习}
  K4: {name: 知识网络化, goal: 知识学习}
  K5: {name: 丰富受负荷预算约束, goal: 知识学习}
  U1: {name: 生成先于告知, goal: 能够学懂}
  U2: {name: 证据锚定, goal: 能够学懂}
  U3: {name: 校准后亲自修订, goal: 能够学懂}
  U4: {name: "困难诊断 → 手法匹配", goal: 能够学懂}
  U5: {name: 负荷管理, goal: 能够学懂}
  U6: {name: 解释分层, goal: 能够学懂}
  U7: {name: 反例诚实路径, goal: 能够学懂}
  U8: {name: 理解闭环, goal: 能够学懂}
  J1: {name: 自主感, goal: 享受学习}
  J2: {name: 胜任感, goal: 享受学习}
  J3: {name: 关联感, goal: 享受学习}
  J4: {name: 文学本身的愉悦, goal: 享受学习}
  J5: {name: 节奏多样, goal: 享受学习}
  J6: {name: 心理安全, goal: 享受学习}
  J7: {name: 流畅错觉防线, goal: 享受学习}

principles:
  # ---------- 《备课基本原则》43 条 ----------
  - id: P-01
    title: 学生接收优先于教师发送
    statement: "教师讲过、PPT出现过、学生能够理解解释运用是三件事；每个课堂节点检查学生实际看见、听见、做过、想过和留下了什么，不以发送量评价课堂完整性。"
    domain: 通用
    stages: [S3, S5, S6]
    nodes: [K5, U2]
    anchor: {doc: work/备课基本原则.md, heading: "### 1. 学生接收优先于教师发送"}
    enforcement:
      - {type: design_trace, fields: [first_person_reception, observable_change]}
      - {type: review_gate, gate: 学生接收审查}
  - id: P-02
    title: 原文是语文课堂的主线
    statement: "按整体进入—局部细读—重新整体化推进；主题、背景、手法和现实讨论必须从原文生长，不能用知识结论页替代学生经历原文的过程。"
    domain: 语文
    stages: [S3]
    nodes: [K2, J4]
    anchor: {doc: work/备课基本原则.md, heading: "### 2. 原文是语文课堂的主线"}
    enforcement:
      - {type: machine_check, checker: scripts/meng_v6/verify_text.js, rule: 文本契约}
      - {type: review_gate, gate: 学生接收审查}
  - id: P-03
    title: 体验先于命名
    statement: "先让学生朗读、聆听、观察、比较、想象、停顿和表达，再用术语解释已经发生的体验；概念不作为课堂入口。"
    domain: 语文
    stages: [S3]
    nodes: [U1, J4]
    anchor: {doc: work/备课基本原则.md, heading: "### 3. 体验先于命名"}
    enforcement:
      - {type: review_gate, gate: 学生接收审查}
  - id: P-04
    title: 知识在相应文本位置生长
    statement: "字音、词义、句法、手法、结构、情感和文化知识在相应语句中讲清；全文结束后通过先检索后回收总结，知识收纳不能截断阅读过程。"
    domain: 语文
    stages: [S3, S4]
    nodes: [K2]
    anchor: {doc: work/备课基本原则.md, heading: "### 4. 知识在相应文本位置生长"}
    enforcement:
      - {type: design_trace, fields: [literary_object]}
  - id: P-05
    title: 问题先于答案
    statement: "问题页给学生独立生成、保存分歧和形成初稿的时间；回收页只能在学生已有产出后出现。"
    domain: 通用
    stages: [S3, S7]
    nodes: [U1]
    anchor: {doc: work/备课基本原则.md, heading: "### 5. 问题先于答案"}
    enforcement:
      - {type: machine_check, checker: scripts/checks/run_principle_checks.py, rule: 独立问题态先于回收态, status: planned}
      - {type: design_trace, fields: [info_state]}
  - id: P-06
    title: 活动必须服务理解并留下证据
    statement: "每项活动直接服务某段原文并形成可检查的标记、口译、朗读方案、图示、排序、判断、解释或修订；删除活动后若不影响学习则活动没有必要。"
    domain: 通用
    stages: [S3]
    nodes: [U8]
    anchor: {doc: work/备课基本原则.md, heading: "### 6. 活动必须服务理解并留下证据"}
    enforcement:
      - {type: machine_check, checker: scripts/validate_meng_v6_page_audit.py, rule: G5产物后用}
      - {type: design_trace, fields: [artifact, next_use]}
  - id: P-07
    title: 学生前台与教师后台严格分离
    statement: "舞台指令、设计意图、方法论与评估口径只进入教案、备注与审计；学生可见区只显示此刻必须面对的原文、问题、任务材料、操作要求和活动后共同发现。"
    domain: 通用
    stages: [S3, S4]
    nodes: [U1]
    anchor: {doc: work/备课基本原则.md, heading: "### 7. 学生前台与教师后台严格分离"}
    enforcement:
      - {type: machine_check, checker: scripts/checks/run_principle_checks.py, rule: 前台禁词扫描}
      - {type: machine_check, checker: scripts/checks/run_principle_checks.py, rule: 前台物料泄漏扫描}
  - id: P-08
    title: 每一页都有可演出的真实剧本
    statement: "逐字稿至少包含承接、教师原话、学生动作与明确秒数、回应分支、可观察证据和切页句；动作总时长不超过页面标称时间。"
    domain: 通用
    stages: [S4]
    nodes: [U1, U3]
    anchor: {doc: work/备课基本原则.md, heading: "### 8. 每一页都有可演出的真实剧本"}
    enforcement:
      - {type: machine_check, checker: scripts/validate_lesson_schema.py, rule: 逐字稿结构标记与时间盒守恒}
      - {type: machine_check, checker: scripts/validate_lesson_schema.py, rule: 逐字稿可演出标记}
  - id: P-09
    title: 解释分层并守住伦理边界
    statement: "区分文本事实、合理推断、文本不能证明和现代解释工具；现实迁移不冒充作者原意；人物困境不得被写成人物责任。"
    domain: 语文
    stages: [S2, S3]
    nodes: [U6, J6]
    anchor: {doc: work/备课基本原则.md, heading: "### 9. 解释分层并守住伦理边界"}
    enforcement:
      - {type: machine_check, checker: scripts/validate_meng_v6_page_audit.py, rule: epistemic_status枚举}
      - {type: machine_check, checker: scripts/checks/run_principle_checks.py, rule: 备注受害归因句式扫描, status: planned}
  - id: P-10
    title: 完整母版先于课时压缩
    statement: "先设计学生真正需要经历的完整母版；压缩版只在原文意义单元和安全停点分割，并依真实试教证据删减。"
    domain: 通用
    stages: [S3]
    nodes: [K5]
    anchor: {doc: work/备课基本原则.md, heading: "### 10. 完整母版先于课时压缩"}
    enforcement:
      - {type: review_gate, gate: 课时切分审计}
  - id: P-11
    title: 多种材料同源，当前版本唯一
    statement: "教案、学习单、PPT、备注、审计与验证器来自共享数据或明确映射；正式目录只保留一个当前版本。"
    domain: 通用
    stages: [S4, S5]
    nodes: []
    role: meta
    justification: "同源与单版本是跨渠道审计可执行的前提，服务全部节点的机器检查基础"
    anchor: {doc: work/备课基本原则.md, heading: "### 11. 多种材料同源，当前版本唯一"}
    enforcement:
      - {type: machine_check, checker: tests/test_build_meng_v66_pptx.js, rule: manifest哈希一致, status: planned}
      - {type: meta, rule: 正式目录单一当前版本}
  - id: P-12
    title: 桌面验证不冒充真实课堂效果
    statement: "自动测试与代理审查只证明设计条件；未真实试教前不得声称学生已理解、感动、享受或完成迁移。"
    domain: 通用
    stages: [S5, S6, S9]
    nodes: [J7]
    anchor: {doc: work/备课基本原则.md, heading: "### 12. 桌面验证不冒充真实课堂效果"}
    enforcement:
      - {type: review_gate, gate: 交付报告诚实声明}
      - {type: machine_check, checker: scripts/checks/run_principle_checks.py, rule: 报告两本账分列}
  - id: P-13
    title: 学生前台文字应有语文的质地
    statement: "学生看到听到的课堂语言优先使用人物、动作、场景、声音、诗句和真实提问；所有学生可见标题问题指令必须通过课堂朗读测试。"
    domain: 语文
    stages: [S3, S4]
    nodes: [J4]
    anchor: {doc: work/备课基本原则.md, heading: "### 13. 学生前台文字应有语文的质地"}
    enforcement:
      - {type: machine_check, checker: scripts/checks/run_principle_checks.py, rule: 前台禁词扫描}
      - {type: review_gate, gate: 前台朗读测试}
  - id: P-14
    title: 参与必须进入意义生成
    statement: "真正的参与是学生对文本作出自己的讲述、选择、解释和判断，并在倾听他人后补充、质疑或改变原先看法；核心活动包含个人准备、小组共作、全班表达、同伴追问、返回原诗和可见修订。"
    domain: 通用
    stages: [S3]
    nodes: [J1]
    anchor: {doc: work/备课基本原则.md, heading: "### 14. 参与必须进入意义生成"}
    enforcement:
      - {type: design_trace, fields: [participation_path]}
      - {type: review_gate, gate: 学生接收审查}
  - id: P-15
    title: 每页必须证明自己的不可替代意义
    statement: "每页明确前页已知、解决哪个具体困难、学生完成哪个动作、留下什么可检查产物、怎样反馈修订、后页哪里真实调用、删除造成什么损失；相邻页能无损承担时合并或删除。"
    domain: 通用
    stages: [S3, S5]
    nodes: [U5, U8]
    anchor: {doc: work/备课基本原则.md, heading: "### 15. 每页必须证明自己的不可替代意义"}
    enforcement:
      - {type: machine_check, checker: scripts/validate_meng_v6_page_audit.py, rule: 18字段完整与G6}
  - id: P-16
    title: 维护学生信息状态并审计全部暴露渠道
    statement: "为每个学习事件维护已知—未知—此刻揭示—暂缓判断的信息状态，并逐渠道（屏幕、台词、学习单、教材、板书、音频、实物、课前材料）核对暴露时点。"
    domain: 通用
    stages: [S3, S5]
    nodes: [U1]
    anchor: {doc: work/备课基本原则.md, heading: "### 16. 维护学生信息状态并审计全部暴露渠道"}
    enforcement:
      - {type: design_trace, fields: [info_state]}
      - {type: review_gate, gate: 多渠道泄答测试}
  - id: P-17
    title: 正常反例必须有诚实路径
    statement: "对想不起、暂无新增、已经读顺、误读、沉默、不同意、走神和超时，学生有同等可见、可完成且无需伪造观点的路径；边界路径不能藏在后台。"
    domain: 通用
    stages: [S3]
    nodes: [U7, J6]
    anchor: {doc: work/备课基本原则.md, heading: "### 17. 正常反例必须有诚实路径"}
    enforcement:
      - {type: design_trace, fields: [normal_counterexample]}
      - {type: machine_check, checker: scripts/checks/check_trace_evidence.py, rule: 反样板}
  - id: P-18
    title: 视觉和插图必须承担学习功能
    statement: "视觉先服从页面唯一意义再追求美感；插图只有在能帮助学生辨认动作、空间、时间或意象且课堂中被观察比较引用时才能进入。"
    domain: 语文
    stages: [S3, S4]
    nodes: [U1, J4]
    anchor: {doc: work/备课基本原则.md, heading: "### 18. 视觉和插图必须承担学习功能"}
    enforcement:
      - {type: design_trace, fields: [visual_duty, illustration_eligibility]}
      - {type: review_gate, gate: 视觉功能审查}
  - id: P-19
    title: 每页接受第一人称接收检验
    statement: "一页结束后学生应能用第一人称说清读了什么、做了什么、比上一页多明白什么、依据哪一句、修改了哪里；审查者必须能沿画面逐字稿学习单证明这条接收链。"
    domain: 通用
    stages: [S3, S5]
    nodes: [U2, J2]
    anchor: {doc: work/备课基本原则.md, heading: "### 19. 每页接受第一人称接收检验"}
    enforcement:
      - {type: design_trace, fields: [first_person_reception]}
      - {type: machine_check, checker: scripts/checks/check_trace_evidence.py, rule: 反样板}
      - {type: review_gate, gate: 学生接收审查}
  - id: P-20
    title: 教学手法由学习困难选择并保持真实体验差异
    statement: "先辨认困难属于哪一类再选能改变学生经验的手法；连续页面不得只是换标题；丰富性以学生认知动作和社会互动方式是否变化为准。"
    domain: 语文
    stages: [S3]
    nodes: [U4, J5]
    anchor: {doc: work/备课基本原则.md, heading: "### 20. 教学手法由学习困难选择，并保持真实体验差异"}
    enforcement:
      - {type: design_trace, fields: [unique_difficulty]}
      - {type: review_gate, gate: 去同质化审计}
  - id: P-21
    title: 独立评估实行缺陷否决
    statement: "独立视觉审查与学生接收审查逐页复验；P0/P1/P2任一存在即不放行，总分美观或其他优点不能抵消；P3只保留必须真实试教才能判断的风险并登记观察方法。"
    domain: 通用
    stages: [S5]
    nodes: [J7]
    anchor: {doc: work/备课基本原则.md, heading: "### 21. 独立评估实行缺陷否决，不以平均分妥协"}
    enforcement:
      - {type: machine_check, checker: scripts/validate_meng_v6_page_audit.py, rule: 双审回执P0P1P2清零}
      - {type: review_gate, gate: 独立双审}
  - id: P-22
    title: 活动程序必须有注意力预算
    statement: "学生为理解活动规则投入的注意力应显著少于面对诗文人物同伴表达的注意力；前台原则上一个主动作、一个必要反馈、一个亲自修订；学生课后更易复述活动手续则至少判P2。"
    domain: 通用
    stages: [S3, S5]
    nodes: [U5, J7]
    anchor: {doc: work/备课基本原则.md, heading: "### 22. 活动程序必须有注意力预算"}
    enforcement:
      - {type: machine_check, checker: scripts/checks/run_principle_checks.py, rule: 退役程序词扫描}
      - {type: review_gate, gate: 程序成本语文收益测试}
  - id: P-23
    title: 教师应在学生广泛表达后承担归纳责任
    statement: "开放发言后由教师引用学生原话整理共同线索、差异和未解决问题；归纳后置、有证据、可被学生补充修正。"
    domain: 通用
    stages: [S3]
    nodes: [U3]
    anchor: {doc: work/备课基本原则.md, heading: "### 23. 教师应在学生广泛表达后承担归纳责任"}
    enforcement:
      - {type: design_trace, fields: [teacher_role]}
      - {type: review_gate, gate: 教师归纳责任测试}
  - id: P-24
    title: 局部学习必须回到人物和故事
    statement: "字词句法朗读空间意象手法可以让叙事暂时停驻，但页面结束前必须回答这句诗让谁做了什么、人物处境怎样变化；学生只能说圈了词画了卡则不得放行。"
    domain: 语文
    stages: [S3]
    nodes: [U2]
    anchor: {doc: work/备课基本原则.md, heading: "### 24. 局部学习必须回到人物和故事"}
    enforcement:
      - {type: design_trace, fields: [story_return]}
      - {type: review_gate, gate: 活动遮蔽故事测试}
  - id: P-25
    title: 学生材料按真实分发时点设计和审计
    statement: "会改变初读体验的材料拆成按时发放的独立物件；每份纸质材料登记首次可见时间、发放人、当时已知、是否提前泄露；没有真实分发台词的不算控制机制。"
    domain: 通用
    stages: [S3, S4, S5]
    nodes: [U1]
    anchor: {doc: work/备课基本原则.md, heading: "### 25. 学生材料按真实分发时点设计和审计"}
    enforcement:
      - {type: review_gate, gate: 真实分发顺序测试}
  - id: P-26
    title: 单页有用不等于值得独立成页
    statement: "逐页优化同时接受相邻页和全课因果链的反证；产物在整课没有真实消费者就合并移动删除；每模块完成后检查连续理解轨迹可见。"
    domain: 通用
    stages: [S3, S5]
    nodes: [U5, U8]
    anchor: {doc: work/备课基本原则.md, heading: "### 26. 单页有用不等于值得独立成页"}
    enforcement:
      - {type: machine_check, checker: scripts/validate_meng_v6_page_audit.py, rule: G5G6与连续理解}
  - id: P-27
    title: 全员参与与公共表达质量分别设计
    statement: "分别提供证据：每个人确实说读写修订过；公共材料足够准确丰富并可被教师后置归纳；不能用公共发言人数替代全员认知参与。"
    domain: 通用
    stages: [S3, S5]
    nodes: [U7, J3]
    anchor: {doc: work/备课基本原则.md, heading: "### 27. 全员参与与公共表达质量分别设计"}
    enforcement:
      - {type: machine_check, checker: scripts/validate_meng_v6_page_audit.py, rule: voice_coverage全员计量}
      - {type: review_gate, gate: 全员开口与公共作品限额测试}
  - id: P-28
    title: 标准必须进入生成和放行机制
    statement: "原则文件本身不能证明原则已经执行；数据源必须完整提交合同字段，缺关键字段或不一致时构建器或验证器直接失败；自动合同不能替代独立审查但必须阻止已知退化。"
    domain: 通用
    stages: [S3, S4, S5]
    nodes: []
    role: meta
    justification: "本注册库自身——原则必须以 machine_check/design_trace/review_gate 之一进入管线才有效"
    anchor: {doc: work/备课基本原则.md, heading: "### 28. 标准必须进入生成和放行机制"}
    enforcement:
