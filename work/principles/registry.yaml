  - id: P-44
    title: 教案先行与目标结构
    statement: "备课从写教案开始：教学目标分素养维度目标与现实迁移目标（由全课追问承载落地），享受不单列目标（属常态品质要求，见 P-45）；知识清单逐项绑定知识卡或注明无卡缺口；教案经审核讨论通过后才转课程数据与页面设计。"
    domain: 通用
    stages: [S3]
    nodes: [K1]
    anchor: {doc: work/备课基本原则.md, heading: "### 44. 教案先行与目标结构"}
