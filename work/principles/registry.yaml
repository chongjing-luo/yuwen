  - id: P-32
    title: 教师既不包办答案也不退化为流程管理员
    statement: "字词文化句法准确微讲；复杂联系先示范一处再迁移；值得的诗句用朗读示范、叙事复述、板书建模和文学停留提供经验；对学生生成材料承担后置归纳与语言提升。"
