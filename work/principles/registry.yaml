  - id: P-30
    title: 导入阶段的思考深度必须服从导入功能
    statement: "导入首要功能是扩大文学记忆、降低开口门槛；共同证据未建立时不得要求抽象分析；深度在共享原文和证据以后发生。"
    domain: 语文
