  # ---------- 新原则（由三目标机制补全，Phase C/E 落地） ----------
  - id: N-01
    title: 教级知识清单以知识卡为准
    statement: "每课教学设计引用知识卡与单元图谱界定教级KP；每个教级KP有课堂落点或显式defer（含理由）；课程数据的knowledge_refs必须解析到真实卡片。"
    domain: 语文
    stages: [S2, S3, S7, S8]
    nodes: [K1]
    anchor: {doc: work/evaluation/三目标实现机制.md, heading: "### K1 教什么先于怎么教（知识界定）"}
    enforcement:
      - {type: machine_check, checker: scripts/validate_lesson_schema.py, rule: card_refs与kp_scope解析到知识卡且defer有理由}
      - {type: machine_check, checker: scripts/validate_homework_package.py, rule: 作业题kp_ids解析}
      - {type: machine_check, checker: scripts/validate_assessment_package.py, rule: 蓝图kp_weights解析与覆盖}
    status: active
  - id: N-02
    title: 检索与间隔排程
    statement: "核心KP在课堂首答、作业闭卷、单元测评、跨课回投中被至少两次以提取方式激活；单元规划含复现排程表；作业含闭卷检索题。"
    domain: 通用
    stages: [S1, S7, S8]
    nodes: [K3]
    anchor: {doc: work/evaluation/三目标实现机制.md, heading: "### K3 检索与间隔（知识巩固排程）"}
    enforcement:
      - {type: machine_check, checker: scripts/validate_homework_package.py, rule: 闭卷检索题必含与时长上限}
      - {type: machine_check, checker: scripts/validate_assessment_package.py, rule: 蓝图必须引用lesson与作业构成四站闭环}
    status: active
  - id: N-03
    title: 知识网络化贯通
    statement: "课程数据的关系边引用真实卡片ID；单元规划上下游贯通；延伸作业含跨课文比较。"
    domain: 语文
    stages: [S1, S2, S7]
    nodes: [K4]
    anchor: {doc: work/evaluation/三目标实现机制.md, heading: "### K4 知识网络化（纵向贯通）"}
    enforcement:
      - {type: machine_check, checker: scripts/validate_lesson_schema.py, rule: relations关系边解析到真实卡片}
      - {type: machine_check, checker: scripts/validate_homework_package.py, rule: cross_book_refs跨册边解析}
    status: active

  - id: N-04
    title: 断言式标题仅限后置完成态
    statement: "断言-证据式标题（完整判断句）只用于后置完成态、讲解页与校准态；首答态页面标题只命名此刻面对的文学对象或留开放问题，不得在标题完成本页学习任务。"
